schema = 1

[playbook.bug-fix]
source = { root = "skills", path = "poteto-mode/playbooks/bug-fix.md" }

[[playbook.bug-fix.part]]
id = "bug-fix.intro-1"
select = "intro:1"
owners = ["master", "sidekick", "verifier"]
reviewed = "244bab33ef86"

[playbook.bug-fix.part.kitchen]
master = "You own the plan and the review. Hand the investigation and the fix to the sidekick through the brief, and stay in the lead: plan, review, verify."
sidekick = "You own the investigation and the fix inside the brief's Scope. The master plans and reviews, and the verifier proves. You may delegate to a subagent on your roster model, within your role's limits."
verifier = "You own the proof, not the fix. Prove the brief's Acceptance on the real surface at the unit's head. You may delegate to a subagent on your roster model, within your role's limits, for independent reads and probes only."

[[playbook.bug-fix.part]]
id = "bug-fix.intro-2"
select = "intro:2"
owners = ["master", "sidekick", "verifier"]
reviewed = "6a4d6e5f2d16"

[[playbook.bug-fix.part]]
id = "bug-fix.step-1"
select = "step:1"
owners = ["sidekick", "verifier"]
reviewed = "537cb8336044"

[playbook.bug-fix.part.kitchen]
sidekick = "Reproduce it yourself on the matching surface via the repo's verification skill, even when a debug or instrumentation protocol says to ask the user to reproduce. If the control surface cannot reach the target, say why, specifically, in the report under Questions with status blocked, after driving it as far as it goes; the master asks the human. If it won't reproduce directly, synthesize the trigger, tighten conditions, or instrument until it fires."
verifier = "Reproduce the original failure yourself on the matching surface at the unit's parent, then show it gone at the unit's head. A surface you cannot drive is reported inconclusive in the verdict with the specific reason; you never ask the human."

# The verifier is not an owner: a hypothesis hunt leaves it nothing to check; it checks the mechanism at step 3.
[[playbook.bug-fix.part]]
id = "bug-fix.step-2"
select = "step:2"
owners = ["sidekick"]
reviewed = "a4a2ec7e7d6c"

[playbook.bug-fix.part.kitchen]
sidekick = "Binary-search the cause. Form the candidate hypotheses, then rule them out until one survives. Seed them with `how` over the affected subsystem and the **why** skill for regression history. Each pass, take the split that cuts the most remaining problem space, get runtime evidence, eliminate. When program state is unclear, add instrumentation or logging and read it as the code runs. Don't guess. Keep a long or stubborn hunt going inside your session and record each change of approach with a progress line. Confirm the surviving *mechanism* with runtime evidence before the step-3 architect fan-out."

[[playbook.bug-fix.part]]
id = "bug-fix.step-3"
select = "step:3"
owners = ["sidekick", "verifier"]
reviewed = "254702d1f198"

[playbook.bug-fix.part.kitchen]
sidekick = "Plan the fix. If it crosses a function boundary, `architect` first. You implement the fix inside the brief's Scope with a specific scope in mind; you may delegate to a subagent on your roster model, within your role's limits, for disjoint scoped edits that you integrate serially."
verifier = "The fix is the sidekick's. Check the diff against the mechanism the evidence supports; a change the evidence does not justify is a finding."

[[playbook.bug-fix.part]]
id = "bug-fix.step-4"
select = "step:4"
owners = ["sidekick", "verifier"]
reviewed = "2bda1ead9cea"

[[playbook.bug-fix.part]]
id = "bug-fix.step-5"
select = "step:5"
owners = ["sidekick", "verifier"]
reviewed = "842691b3d4d5"

[playbook.bug-fix.part.kitchen]
verifier = "Check from the unit's commit range that the failing repro or test lands before the fix in history; where it does not, say so as a finding. Do not restage or edit commits."

[[playbook.bug-fix.part]]
id = "bug-fix.step-6"
select = "step:6"
owners = ["master", "sidekick"]
reviewed = "500c69edcf1b"

[playbook.bug-fix.part.kitchen]
master = "Open a PR only as far as the kitchen's [landing].mode allows, and only when the brief says so; the kitchen never merges, and the master stops at the mode."
sidekick = "Open a PR only when the brief says so; otherwise the last commit recorded with kitchen.sh step is the deliverable."

[[playbook.bug-fix.part]]
id = "bug-fix.reply"
select = "reply"
owners = ["sidekick", "verifier"]
reviewed = "2b41ae474b55"

[playbook.bug-fix.part.kitchen]
sidekick = "In the report, under Ran and the sections the template names: what was broken, the root cause, the fix, and how you verified it. Paste the failing-then-passing repro output verbatim. Every claim carries its command output or a file pointer."
verifier = "The evidence standard for the brief's Acceptance, not new criteria: the failing-then-passing repro output, verbatim. A verdict line cites the command output that shows it."

