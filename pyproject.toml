[project]
name = "open-pstack"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.2", "ty==0.0.91"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["*.py", "*.pyi"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["F", "B", "PLE", "E9", "I"]
